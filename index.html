<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover + le safe-area in CSS: senza, su iPhone con notch la
       barra superiore e il FAB finivano sotto gli angoli arrotondati. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TVTRACKER - Gestione Serie TV</title>
  <meta name="description" content="Libreria e gestore di serie TV: categorie con drag &amp; drop, voti per cast, trama, ambientazione, colonna sonora e coinvolgimento, calendario delle prossime uscite e consigli personalizzati." />
  <meta name="color-scheme" content="dark light" />

  <!-- Condivisione: l'app ha un pulsante "Condividi", ma il link incollato in
       chat non mostrava né titolo né descrizione. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TVTRACKER" />
  <meta property="og:title" content="TVTRACKER - Gestione Serie TV" />
  <meta property="og:description" content="Libreria e gestore di serie TV: categorie, voti, calendario uscite e consigli personalizzati." />
  <meta property="og:image" content="icon-512.png" />
  <meta property="og:locale" content="it_IT" />
  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- [PERF] Sora e Unbounded sono font VARIABILI: chiedendo un intervallo
       (400..800) invece di sei pesi singoli si scarica UN solo file per famiglia
       invece di sei. Da 12 richieste a 2, senza toccare una riga di CSS. -->
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400..800&family=Unbounded:wght@600..900&display=swap" rel="stylesheet">
  <!-- [PERF] all.min.css include anche brands e regular: nel progetto si usa
       esclusivamente la famiglia solid (fas). Caricando solo base + solid si
       evita di scaricare il CSS di ~2.000 icone che non compaiono mai. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
  <!-- Deve restare inline ed eseguire prima del primo paint, altrimenti il tema
       chiaro sfarfalla partendo da quello scuro. Con una CSP si copre con un hash
       (script-src 'sha256-...'), non serve 'unsafe-inline'. -->
  <script>(function(){try{
    var saved = localStorage.getItem('tvtracker-theme');
    // Nessuna scelta salvata: si segue il tema di sistema invece di imporre il
    // dark. Una volta che l'utente tocca il pulsante, la sua scelta vince sempre.
    var light = saved ? saved === 'light'
                      : window.matchMedia('(prefers-color-scheme: light)').matches;
    if (light) document.documentElement.setAttribute('data-theme','light');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', light ? '#f6f3ee' : '#0a0a0a');
  }catch(e){}})();</script>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
</head>
<body>
<noscript>
  <p style="padding:16px;font-family:system-ui,sans-serif;">TVTRACKER ha bisogno di JavaScript attivo per funzionare.</p>
</noscript>
<div class="loading-bar" id="loadingBar" aria-hidden="true"></div>
<div class="offline-banner" id="offlineBanner" role="status">
  <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
  <span>Sei offline — vedi i dati salvati, ma ricerca nuove serie, poster e episodi non sono disponibili finché non torni online.</span>
</div>
<div class="top-bar">
  <div class="top-bar-left">
    <div class="logo">TVTRACKER</div>
    <div class="subtitle">Gestisci le tue serie TV con drag &amp; drop</div>
    <div class="sync-status" id="syncStatus" role="status">
      <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i>
      <span>Connessione...</span>
    </div>
    <div class="button-group">
      <button class="btn btn-secondary" id="themeToggleBtn" title="Cambia tema chiaro/scuro" aria-label="Cambia tema chiaro/scuro">
        <i class="fas fa-sun theme-icon-light" aria-hidden="true"></i><i class="fas fa-moon theme-icon-dark" aria-hidden="true"></i>
      </button>
      <button class="btn btn-primary bar-action" id="printListBtn"><i class="fas fa-print btn-icon" aria-hidden="true"></i> Stampa lista</button>
      <button class="btn btn-secondary bar-action" id="statsBtn"><i class="fas fa-chart-bar btn-icon" aria-hidden="true"></i> Statistiche</button>
      <button class="btn btn-secondary bar-action" id="resetBtn"><i class="fas fa-redo btn-icon" aria-hidden="true"></i> Reset</button>
      <div class="view-toggle" id="viewToggle" role="group" aria-label="Modalità di visualizzazione">
        <button data-view="grid" title="Vista griglia" aria-label="Vista griglia"><i class="fas fa-th" aria-hidden="true"></i></button>
        <button data-view="list" title="Vista lista" aria-label="Vista lista"><i class="fas fa-list" aria-hidden="true"></i></button>
      </div>
      <!-- Menu azioni secondarie. Un solo pulsante per tutte le taglie di schermo:
           su desktop contiene le cinque voci meno frequenti, su mobile (dove la
           barra nasconde i bottoni) contiene anche Stampa, Statistiche e Reset.
           Il pannello è disegnato da openFloatingMenu e vive in <body>: .top-bar
           ha overflow:hidden e taglierebbe qualsiasi dropdown figlio. -->
      <button class="btn btn-secondary btn-icon-only" id="actionsMenuBtn" title="Altre azioni" aria-label="Altre azioni" aria-haspopup="menu" aria-expanded="false"><i class="fas fa-ellipsis-vertical" aria-hidden="true"></i></button>
      <input type="file" id="importFileInput" accept=".json" style="display:none" />
    </div>
  </div>
  <form class="add-category-form" id="addCategoryForm">
    <div class="input-group">
      <i class="fas fa-plus input-icon" aria-hidden="true"></i>
      <input type="text" id="newCategoryName" class="form-input" placeholder="Nome nuova categoria..." aria-label="Nome nuova categoria" autocomplete="off" />
    </div>
    <button type="submit" class="btn btn-primary"><i class="fas fa-folder-plus btn-icon" aria-hidden="true"></i> Aggiungi</button>
  </form>
</div>

<div class="search-bar-wrap">
  <i class="fas fa-search search-icon" aria-hidden="true"></i>
  <input type="text" class="search-input" id="searchInput" placeholder="Cerca una serie in tutte le categorie..." aria-label="Cerca una serie in tutte le categorie" autocomplete="off" />
  <button class="search-clear" id="searchClear" aria-label="Cancella la ricerca"><i class="fas fa-times" aria-hidden="true"></i></button>
  <div class="search-results-info" id="searchResultsInfo" role="status" style="display:none"></div>
</div>

<div id="listFiltersContainer"></div>

<div class="rating-legend">
  <span class="rating-legend-label">VOTI</span>
  <span class="rating-legend-item"><span class="dot good"></span>8.0 &ndash; 10</span>
  <span class="rating-legend-item"><span class="dot mid"></span>6.0 &ndash; 7.9</span>
  <span class="rating-legend-item"><span class="dot bad"></span>3.1 &ndash; 5.9</span>
  <span class="rating-legend-item"><span class="dot awful"></span>&le; 3.0</span>
</div>

<div class="side-nav-edge" id="sideNavEdge" title="Categorie" aria-hidden="true"></div>
<button class="side-nav-toggle-mobile" id="sideNavToggleMobile" title="Categorie" aria-label="Apri l'elenco delle categorie" aria-expanded="false">
  <i class="fas fa-bars" aria-hidden="true"></i>
</button>
<div class="side-nav-backdrop" id="sideNavBackdrop"></div>
<div class="side-nav-panel" id="sideNavPanel" role="navigation" aria-label="Categorie">
  <div class="side-nav-header">
    <span>Categorie</span>
    <button class="side-nav-close" id="sideNavClose" aria-label="Chiudi l'elenco delle categorie"><i class="fas fa-times" aria-hidden="true"></i></button>
  </div>
  <div class="side-nav-list" id="sideNavList"></div>
</div>

<div id="errorContainer" role="status" aria-live="polite"></div>
<div id="resumeContainer"></div>
<div id="upcomingContainer"></div>
<div id="legendsContainer"></div>
<div class="categories" id="categoriesContainer"></div>
<div id="recommendationsContainer"></div>

<button class="rating-fab" id="ratingFab" title="Valuta una serie a caso" aria-label="Valuta una serie a caso">
  <i class="fas fa-star" aria-hidden="true"></i>
</button>
<div class="rating-fab-tooltip" id="ratingFabTooltip" aria-hidden="true">Valuta serie casuale</div>
<div id="bulkBarContainer"></div>

<script src="app.js"></script>
</body>
</html>
